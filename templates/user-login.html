<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login | MEDTRUST AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 15% 20%, rgba(91, 192, 190, 0.12), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(155, 135, 212, 0.12), transparent 30%),
                #101820;
        }

        .login-page {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .login-card {
            background: rgba(247, 243, 234, 0.98);
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .login-logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 25px;
            font-weight: 700;
            color: #101820;
            margin-bottom: 8px;
        }

        .login-logo span {
            color: #087E8B;
        }

        .login-label {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #087E8B;
            margin-bottom: 10px;
        }

        .login-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 32px;
            color: #101820;
            margin: 0 0 8px;
        }

        .login-description {
            color: #5e6670;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #101820;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #d8d4cb;
            border-radius: 12px;
            background: white;
            color: #101820;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #087E8B;
            box-shadow: 0 0 0 3px rgba(8, 126, 139, 0.12);
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #087E8B;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(8, 126, 139, 0.25);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #087E8B;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .demo-account {
            margin-top: 24px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(8, 126, 139, 0.07);
            font-size: 13px;
            color: #5e6670;
        }

        .demo-account strong {
            color: #101820;
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                MEDTRUST <span>AI</span>
            </div>

            <span class="login-label">User Access</span>

            <h1 class="login-title">Welcome back</h1>

            <p class="login-description">
                Sign in to analyze AI-generated healthcare responses
                and review their safety.
            </p>

            <form action="/user-dashboard" method="GET">

                <div class="form-group">
                    <label for="user-email">Email Address</label>

                    <input
                        type="email"
                        id="user-email"
                        name="email"
                        placeholder="Enter your email"
                        list="user-email-list"
                        autocomplete="username"
                        required
                    >

                    <datalist id="user-email-list">
                        <option value="yoshiaws123@gmail.com">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="user-password">Password</label>

                    <input
                        type="password"
                        id="user-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Sign In to MEDTRUST
                </button>

            </form>

            <div class="demo-account">
                <strong>User account:</strong><br>
                yoshiaws123@gmail.com
            </div>

            <a href="/access" class="back-link">
                ← Back to Access Selection
            </a>

        </div>

    </main>

</body>
</html>
